[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrulearn"
version = "0.6.0"
description = "Representing, learning, combining and analyzing propositional rule models: native rule learners (separate-and-conquer, Pypper, CBA, CMAR, IDS, ...) and interfaces to external ones."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Johannes Fürnkranz", email = "juffi@faw.jku.at" }]
keywords = ["rule learning", "machine learning", "interpretable machine learning", "association rules", "decision lists"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "scikit-learn",   # RuleSetClassifier inherits from sklearn.base.BaseEstimator (hence `import pyrulearn` needs it)
]

[project.optional-dependencies]
data = ["pandas", "scipy"]                 # pyrulearn.data.io (scipy: ARFF / sparse representations)
plot = ["matplotlib", "networkx"]          # pyrulearn.evaluation plotting
experiments = ["pandas", "scipy", "matplotlib", "psutil"]  # pyrulearn.experiments: run_cv, stats, report (catalog.load needs pandas; psutil: a timed-out fit's child processes)
wittgenstein = ["wittgenstein"]            # interfaces.wittgenstein: IREP, RIPPER
imodels = ["imodels"]                      # interfaces.imodels: Bayesian rule lists / sets
pyarc = ["pyarc"]                          # interfaces.pyarc: CBA (pyarc itself also needs Borgelt's `pyfim`, a C extension)
boomer = ["mlrl-boomer"]                   # interfaces.boomer: BOOMER (pins scikit-learn)
realkd = ["realkd"]                        # interfaces.realkd: optimal rule boosting (see README for Python 3.14)
sat = ["python-sat"]                       # learners.deep.DeepSAT: SAT/MaxSAT-learned NNF networks
notebook = ["jupyter", "nbconvert", "ipykernel"]  # regenerating tutorial/tutorial.ipynb/.pdf (PDF export also needs LaTeX + pandoc)
test = ["pytest"]
all = ["pandas", "scipy", "matplotlib", "psutil", "networkx", "wittgenstein", "imodels", "pytest"]

[project.urls]
Homepage = "https://github.com/juffif/pyrulearn"
Repository = "https://github.com/juffif/pyrulearn"
Issues = "https://github.com/juffif/pyrulearn/issues"

[tool.setuptools.packages.find]
include = ["pyrulearn*"]

[tool.setuptools.package-data]
"pyrulearn.experiments" = ["catalog.json"]   # the dataset catalog (metadata only, no data)

[tool.pytest.ini_options]
testpaths = ["tests"]
